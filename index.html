<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azlan's Birthday!</title>
  <link rel="stylesheet" href="invite.css?v=3">
</head>
<body>

  <main class="wrap">
    <section class="invite">
      <div class="ball" aria-hidden="true">⚽</div>

      <h1>Azlan's Birthday!</h1>

      <p class="when">
        <span>Sunday, October 18th</span>
        <span class="time">12pm to 4pm</span>
      </p>

      <p class="tagline">🍕 Join me for some pizza, cake and fun! 🎂</p>
      <div class="where">
        <button id="addressBtn" class="address-btn" type="button">📍 Click here to see the address</button>

        <form id="addressForm" class="address-form" hidden>
          <label for="addressAnswer">What is our 5th grade teacher's first name?</label>
          <div class="address-row">
            <input id="addressAnswer" type="text" maxlength="40" autocomplete="off">
            <button class="address-check" type="submit">Check</button>
          </div>
          <p id="addressStatus" class="form-status" aria-live="polite"></p>
        </form>

        <p id="addressReveal" class="address-reveal" aria-live="polite" hidden></p>
      </div>

      <div class="rsvp">
        <h2>⚽ RSVP</h2>

        <form id="rsvpForm" novalidate>
          <label for="rsvpName">Your name</label>
          <input id="rsvpName" type="text" maxlength="40" required
            placeholder="Your name" autocomplete="name">

          <fieldset class="choices">
            <legend>Can you make it?</legend>
            <label class="choice">
              <input type="radio" name="attending" value="yes" required>
              <span>⚽ I'll be there!</span>
            </label>
            <label class="choice">
              <input type="radio" name="attending" value="no">
              <span>😢 Can't make it</span>
            </label>
          </fieldset>

          <div id="guestsRow" hidden>
            <label for="rsvpGuests">How many people are coming (including you)?</label>
            <select id="rsvpGuests">
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option><option>9</option>
              <option>10</option>
            </select>
          </div>

          <label for="rsvpNote">Message for Azlan (optional)</label>
          <textarea id="rsvpNote" maxlength="200" rows="3"
            placeholder="Anything we should know?"></textarea>

          <!-- Spam trap: real people never see or fill this in -->
          <input id="rsvpWebsite" class="trap" type="text" tabindex="-1"
            autocomplete="off" aria-hidden="true">

          <button id="rsvpSubmit" class="rsvp-btn" type="submit">Send RSVP</button>
          <p id="rsvpStatus" class="form-status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <p class="more"><a href="game.html">Click here 4 other stuff</a></p>
  </main>

  <script src="config.js?v=1"></script>
  <script src="invite.js?v=2"></script>
</body>
</html>
