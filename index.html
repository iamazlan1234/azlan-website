<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azlan's Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="azlan-box">
  <h2>👋 Hi! My name is Azlan.</h2>
  <p>This is a very random website. 🚀</p>
</div>

<button id="myButton">Click this button!</button>
<p id="message"></p>
<section class="game-card">
  
  
  
  
  
  <h2>⭐ Lets play a game!
    
   Catch the Star!</h2>
  <p>Click as many stars as you can in 15 seconds!</p>


<div class="game-stats">
  <span>⭐ Score: <strong id="gameScore">0</strong></span>
  <span>⏱️ Time: <strong id="gameTime">15</strong>s</span>
  <span>🏆 Best: <strong id="gameHighScore">0</strong></span>
</div>


  <div id="gameArena" class="game-arena">
    <p id="gameHint">Ready? Let's play!</p>
    <button id="startGame">Start Game</button>
    <button id="starTarget" class="game-star"
      aria-label="Catch the star" hidden>⭐</button>
  </div>

  <p id="gameResult" aria-live="polite">
    Your high score starts now!
  </p>
</section>
  <h1>Welcome to my website</h1>
  <p>This is my website.</p>
  <button>Click me</button>

  <script src="script.js"></script>
</body>
</html>
